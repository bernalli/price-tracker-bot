name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC weekly

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    # gitleaks-action fetches the PR commits via the API on pull_request events
    # (GET /repos/.../pulls/{n}/commits); that needs pull-requests:read on top of
    # the workflow-level contents:read. Job-level permissions replace the inherited
    # set, so both scopes are listed here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks history scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: pip install bandit

      - name: Bandit static analysis
        run: bandit -r src/ -lll -f json -o bandit-report.json

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: bandit-report.json

  osv-scanner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: OSV scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=./uv.lock

  # NOTE: actions/dependency-review-action was removed — it requires the
  # GitHub Advanced Security Dependency Review API, which this repository
  # does not have, so it always failed with "Resource not accessible by
  # integration" on PRs.
  # Dependency CVE scanning is already covered by the osv-scanner job above
  # (scans uv.lock).
