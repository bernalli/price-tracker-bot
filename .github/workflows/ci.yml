name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    continue-on-error: ${{ matrix.python-version == '3.13' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: |
          uv sync --frozen --extra dev --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Compile i18n catalogs
        run: pybabel compile -d src/price_tracker/locale

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy strict
        # Reads files = [...] from [tool.mypy] in pyproject.toml, which lists
        # both src/price_tracker and tests/ (no ci.yml change needed if that
        # scope changes, thanks to the indirection).
        run: mypy --strict

      - name: pytest with coverage
        run: pytest --cov=src/price_tracker --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: English-only audit
        run: bash scripts/audit_english.sh

      - name: Release sync (CHANGELOG vs version)
        run: python scripts/check_release_sync.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
