name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/docker-build.yml"
    tags:
      - "v*.*.*"
  # No paths filter on pull_request: `build` is a required status check on main,
  # and a check that never starts is reported as pending forever — a docs-only PR
  # would be unmergeable without an admin override. Running it on every PR keeps
  # the gate honest at the cost of one image build.
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,format=short,prefix=sha-

      - name: Build (multi-arch) ${{ startsWith(github.ref, 'refs/tags/v') && '+ push' || 'no-push' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The multi-arch build above never loads an image into the daemon, so a
      # green `build` proved that the image compiles and nothing about whether a
      # container starts. Since dependencies now come from the lockfile rather
      # than a fresh resolution, an incomplete pinned set would fail exactly
      # here — at import — and nowhere earlier. Building amd64 alone into the
      # local daemon is almost entirely cache hits from the step above.
      - name: Load the amd64 image so it can be run
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: price-tracker:smoke
          cache-from: type=gha

      - name: Smoke test — the container starts and the application imports
        run: |
          set -euo pipefail
          declared=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          reported=$(docker run --rm price-tracker:smoke python -c 'import price_tracker; print(price_tracker.__version__)')
          echo "pyproject=${declared} image=${reported}"
          # Asserting agreement, not merely a non-empty string: an image built
          # from stale sources would still print something.
          test "${declared}" = "${reported}"
          docker run --rm price-tracker:smoke python -c 'import price_tracker.main'
